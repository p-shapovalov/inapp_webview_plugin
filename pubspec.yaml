name: browser_plugin
description: "In-app webview embedded in the Flutter view — a platform view on iOS, a native view below the transparent Flutter layer on Android."
version: 0.2.0
homepage: https://github.com/p-shapovalov/inapp_webview_plugin
# Consumed as a git dependency, never published to pub.dev.
publish_to: 'none'

environment:
  sdk: "3.11.5"
  flutter: "3.41.9"

dependencies:
  flutter:
    sdk: flutter
  # Android embedding: hosts the WebView below a transparent FlutterView, so
  # Flutter UI can render on top of the live page. Android-only package; the
  # Dart facade only touches it when Platform.isAndroid.
  flutter_native_view_android:
    git:
      url: https://github.com/p-shapovalov/flutter_native_view_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.in_app.webview
        pluginClass: BrowserPlugin
      ios:
        pluginClass: BrowserPlugin
